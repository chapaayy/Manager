name: XPPN Manager 2.0 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only v2 dependencies
        run: python -m pip install -r v2/requirements.txt pytest httpx
      - name: Compile and verify the isolated v2 app
        run: |
          python -m compileall -q v2 tests_v2
          node --check v2/static/app.js
          node tests_v2/test_ui.js
          bash -n v2/preview-install.sh
      - name: Validate Xray transformations, HTTP API and security
        run: python -m pytest -q tests_v2
