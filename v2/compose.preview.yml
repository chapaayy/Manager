name: xppn-v2-preview
services:
  manager-v2:
    build:
      context: ..
      dockerfile: v2/Dockerfile
    restart: unless-stopped
    env_file: .env.preview
    ports:
      - "127.0.0.1:8790:8000"
    volumes:
      - v2-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 160
    mem_limit: 512m
volumes:
  v2-data:
