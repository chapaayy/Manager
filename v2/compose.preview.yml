# COMPATIBILITY ONLY: retained for one transition because the previously
# installed root updater references this exact file after fetching new code.
# New installs and the new updater use compose.yml.
name: xppn-v2-preview
services:
  manager-v2:
    build:
      context: ..
      dockerfile: v2/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.preview
        format: raw
    ports:
      - "127.0.0.1:8790:8000"
    volumes:
      - v2-data:/data
      - /var/lib/xppn-v2-update:/updater:rw
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 160
    mem_limit: 512m
volumes:
  v2-data:
