# XPPN baseline from previous working installer.
# {{source.domain}} is replaced per VPS; Xray TLS fallback -> 127.0.0.1:8080.
server {
    listen 80;
    server_name {{source.domain}};
    access_log /var/log/remnawave-nginx/access.log combined;
    error_log /var/log/remnawave-nginx/error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 8080;
    server_name {{source.domain}};
    access_log /var/log/remnawave-nginx/access.log combined;
    error_log /var/log/remnawave-nginx/error.log warn;
    root /var/www/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
