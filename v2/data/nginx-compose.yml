# Based on legacy XPPN installer. The host-local fallback uses 127.0.0.1:8080.
services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    hostname: nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/nginx/www:/var/www/html:ro
      - /opt/nginx/acme:/var/www/acme:ro
      - /opt/nginx/logs:/var/log/remnawave-nginx
    logging:
      options:
        max-size: "10m"
        max-file: "3"
