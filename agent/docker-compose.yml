services:
  xppn-agent:
    build: ./agent
    image: xppn/agent:1.0.0
    container_name: xppn-agent
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: agent.env
    user: "10001:15001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    volumes:
      - /run/xppn-agent:/run/xppn-agent:ro
