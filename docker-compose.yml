name: xppn-manager
services:
  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    ports:
      - "127.0.0.1:8787:8000"
    volumes:
      - manager-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 180
    mem_limit: 512m
  caddy:
    image: caddy:2.10.2-alpine
    profiles: [public]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - manager
    environment:
      XPPN_DOMAIN: ${XPPN_DOMAIN:?Set XPPN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
volumes:
  manager-data:
  caddy-data:
  caddy-config:
